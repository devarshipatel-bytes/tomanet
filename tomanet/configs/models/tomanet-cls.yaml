# TomaNet-C - classification. Backbone layers 0-8 are byte-identical to tomanet-det.yaml,
# so a trunk trained here initialises the detector (and vice versa).
# Usage: from tomanet.register import register; register()
#        YOLO("configs/models/tomanet-cls.yaml")

nc: 10

scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [1.00, 0.75, 768]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, TomaLayer, [128, 3]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 4, TomaLayer, [256, 3]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, TomaLayer, [512, 5]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, TomaLayer, [1024, 5]] # 8

head:
  - [-1, 1, Classify, [nc]] # 9
